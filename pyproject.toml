
[project]
name = "data-engineering-kozyreva"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.4.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]

[tool.uv]
package = true
